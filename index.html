<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>連絡掲示板</title>
    <style>
        /* --- ベースデザイン --- */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }
        h1.page-title {
            font-size: 1.8rem;
            text-align: center;
            margin: 20px 0 30px;
            color: #2c3e50;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        /* カード共通スタイル */
        .card-style {
            background-color: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* 入力フォーム */
        .input-card { margin-bottom: 30px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #555;
        }
        .required::after { content: " *"; color: #e53935; }
        
        select, textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: #f9fbfc;
            transition: all 0.3s ease;
            appearance: none;
        }
        select:focus, textarea:focus {
            outline: none;
            border-color: #4a90e2;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        textarea { height: 100px; resize: none; }
        
        /* ボタン共通デザイン */
        button.main-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4a90e2 0%, #357abd 100%);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        button.main-btn:active { transform: scale(0.98); opacity: 0.9; }
        button.main-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 画像アップロード関連のデザイン */
        .image-upload-area {
            margin-bottom: 20px;
        }
        .file-select-btn {
            display: inline-block;
            background-color: #e1e8ed;
            color: #555;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .file-select-btn:active { background-color: #d0d7dd; }
        
        #previewContainer {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .preview-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        /* 投稿一覧の画像表示 */
        .post-images {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .post-image-item {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            border: 1px solid #eee;
            object-fit: contain;
        }

        .note {
            font-size: 0.8rem;
            color: #999;
            margin-top: 15px;
            text-align: center;
        }

        /* 投稿一覧 */
        .post-list { margin-top: 10px; }
        .post-card {
            margin-bottom: 16px;
            padding: 20px;
            border-left: 5px solid #4a90e2;
            animation: slideIn 0.4s ease;
        }
        
        /* 固定投稿用のデザイン追加 */
        .pinned-post {
            border: 2px solid #f39c12;
            border-left: 5px solid #f39c12;
            background-color: #fffdf5;
        }
        .pinned-label {
            display: inline-block;
            background-color: #f39c12;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        .author-badge { font-weight: bold; color: #333; font-size: 1rem; }
        .post-date { font-size: 0.8rem; color: #aaa; }
        .post-content {
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
            color: #444;
        }
        .owner-actions {
            margin-top: 15px;
            text-align: right;
            border-top: 1px dotted #eee;
            padding-top: 10px;
        }
        .action-btn {
            background: none;
            border: 1px solid #ddd;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.2s;
        }
        .edit-btn { color: #28a745; border-color: #28a745; }
        .delete-btn { color: #e53935; border-color: #e53935; }
        .pin-btn { color: #f39c12; border-color: #f39c12; } /* 固定ボタン */

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* モーダル */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }
        .modal-overlay.active { display: flex; }
        .modal-content { width: 100%; max-width: 500px; }
        .modal-content h3 { margin-top: 0; margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .modal-content textarea { height: 150px; }
        .modal-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; }
        .modal-actions button { flex: 1; padding: 14px; border-radius: 50px; margin: 0; font-size: 1rem; }
        .cancel-btn { background: #e1e8ed !important; color: #555 !important; box-shadow: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="page-title">連絡掲示板</h1>

    <div class="input-card card-style">
        <label for="author" class="required">投稿者</label>
        <select id="author">
            <option value="" disabled selected>選択してください</option>
            <option value="逢坂">逢坂</option>
            <option value="山本">山本</option>
            <option value="山田">山田</option>
            <option value="金丸">金丸</option>
            <option value="山城">山城</option>
            <option value="向江">向江</option>
        </select>

        <label for="message">メッセージ</label>
        <textarea id="message" placeholder="ここに連絡事項などを入力..."></textarea>

        <div class="image-upload-area">
            <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
            <label for="imageInput" class="file-select-btn">📷️ 画像を追加 (最大3枚)</label>
            <div id="previewContainer"></div>
        </div>

        <button id="submitBtn" class="main-btn">投稿する</button>
        <div class="note">※画像は自動圧縮されます。<br>※編集・削除用にブラウザ情報を利用します。</div>
    </div>

    <div id="timeline" class="post-list">
        <div style="text-align:center; color:#999; padding:20px;">読み込み中...</div>
    </div>
</div>

<div id="editModal" class="modal-overlay">
    <div class="modal-content card-style">
        <h3>内容を編集</h3>
        <textarea id="editInput"></textarea>
        <div class="modal-actions">
            <button id="cancelEditBtn" class="main-btn cancel-btn">キャンセル</button>
            <button id="saveEditBtn" class="main-btn">保存する</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, Timestamp, deleteDoc, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    // =================================================================
    // 【重要】ここに APIキー を貼り付けてください
    // =================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCakQvs7YjgTGsczVC3L9M3vtpIIS_XYDk",
        authDomain: "keijiban-1.firebaseapp.com",
        projectId: "keijiban-1",
        storageBucket: "keijiban-1.firebasestorage.app", 
        messagingSenderId: "419769266348",
        appId: "1:419769266348:web:b19f3b547c7e6f7d0c2f09"
    };
    // =================================================================

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app); 
    const postsRef = collection(db, "posts");

    const STORAGE_KEY = "bbs_user_id";
    let myUserId = localStorage.getItem(STORAGE_KEY);
    if (!myUserId) {
        myUserId = "user_" + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem(STORAGE_KEY, myUserId);
    }

    const authorSelect = document.getElementById("author");
    const messageInput = document.getElementById("message");
    const imageInput = document.getElementById("imageInput");
    const previewContainer = document.getElementById("previewContainer");
    const submitBtn = document.getElementById("submitBtn");
    const timeline = document.getElementById("timeline");

    imageInput.addEventListener("change", () => {
        const files = Array.from(imageInput.files);
        previewContainer.innerHTML = "";
        
        if (files.length > 3) {
            alert("画像は最大3枚までです。");
            imageInput.value = "";
            return;
        }

        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement("img");
                img.src = e.target.result;
                img.className = "preview-thumb";
                previewContainer.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });

    const compressImage = async (file) => {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        resolve(blob);
                    }, "image/jpeg", 0.7); 
                };
            };
        });
    };

    submitBtn.addEventListener("click", async () => {
        const author = authorSelect.value;
        const text = messageInput.value.trim();
        const files = Array.from(imageInput.files);

        if (!author) return alert("投稿者を選択してください");
        if (!text && files.length === 0) return alert("メッセージまたは画像を入力してください");

        submitBtn.disabled = true;
        submitBtn.textContent = "送信中...";

        try {
            const imageUrls = [];
            for (const file of files) {
                const compressedBlob = await compressImage(file);
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.jpg`;
                const storageRef = ref(storage, 'images/' + fileName);
                
                await uploadBytes(storageRef, compressedBlob);
                const url = await getDownloadURL(storageRef);
                imageUrls.push({ url: url, path: 'images/' + fileName });
            }

            await addDoc(postsRef, {
                author: author,
                text: text,
                images: imageUrls, 
                createdAt: Timestamp.now(),
                uid: myUserId,
                isPinned: false // ★ 新規投稿時の固定フラグ初期値
            });

            messageInput.value = "";
            imageInput.value = "";
            previewContainer.innerHTML = "";
        } catch (error) {
            console.error("Error:", error);
            alert("投稿に失敗しました。\nStorage設定やAPIキーを確認してください。");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "投稿する";
        }
    });

    const oneWeekAgo = new Date();
    oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
    const q = query(postsRef, where("createdAt", ">", Timestamp.fromDate(oneWeekAgo)), orderBy("createdAt", "desc"));

    onSnapshot(q, (snapshot) => {
        timeline.innerHTML = "";
        if (snapshot.empty) { timeline.innerHTML = '<div style="text-align:center; color:#ccc; padding:40px;">投稿はまだありません</div>'; return; }
        
        let pinnedHtml = ""; // 固定用
        let normalHtml = ""; // 通常用

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const date = data.createdAt.toDate();
            const timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
            const isMyPost = (data.uid === myUserId);
            const isPinned = data.isPinned === true;
            
            let imagesHtml = "";
            if (data.images && data.images.length > 0) {
                imagesHtml = `<div class="post-images">`;
                data.images.forEach(imgData => {
                    const src = typeof imgData === 'string' ? imgData : imgData.url;
                    imagesHtml += `<a href="${src}" target="_blank"><img src="${src}" class="post-image-item"></a>`;
                });
                imagesHtml += `</div>`;
            }

            let actionButtons = "";
            if (isMyPost) {
                const pinBtnText = isPinned ? "固定解除" : "固定";
                actionButtons = `
                    <div class="owner-actions">
                        <button class="action-btn pin-btn" onclick="togglePin('${docSnap.id}', ${isPinned})">${pinBtnText}</button>
                        <button class="action-btn edit-btn" onclick="openEditModal('${docSnap.id}', '${escapeHtml(data.text).replace(/\n/g, '\\n').replace(/'/g, "\\'")}')">編集</button>
                        <button class="action-btn delete-btn" onclick="deletePost('${docSnap.id}')">削除</button>
                    </div>
                `;
            }
            
            const cardClass = isPinned ? "post-card card-style pinned-post" : "post-card card-style";
            const pinnedLabel = isPinned ? `<div class="pinned-label">📌 固定された投稿</div>` : "";

            const postHtml = `
                <div class="${cardClass}">
                    ${pinnedLabel}
                    <div class="post-header"><span class="author-badge">${escapeHtml(data.author)}</span><span class="post-date">${timeStr}</span></div>
                    <div class="post-content">${escapeHtml(data.text)}${imagesHtml}</div>
                    ${actionButtons}
                </div>
            `;

            // 固定状態に応じて変数を振り分ける
            if (isPinned) {
                pinnedHtml += postHtml;
            } else {
                normalHtml += postHtml;
            }
        });
        
        // 固定投稿を上に、通常投稿を下に合体して表示
        timeline.innerHTML = pinnedHtml + normalHtml;
    });

    // ★ 投稿の固定・解除を行う関数を追加
    window.togglePin = async (id, currentPinned) => {
        try {
            if (!currentPinned) {
                // 新しく固定する場合、既存の固定投稿を探して解除する
                const pinQuery = query(postsRef, where("isPinned", "==", true));
                const pinSnap = await getDocs(pinQuery);
                for (const dSnap of pinSnap.docs) {
                    if (dSnap.id !== id) {
                        await updateDoc(doc(db, "posts", dSnap.id), { isPinned: false });
                    }
                }
                // 対象の投稿を固定
                await updateDoc(doc(db, "posts", id), { isPinned: true });
            } else {
                // 既に固定されている場合は解除のみ
                await updateDoc(doc(db, "posts", id), { isPinned: false });
            }
        } catch (e) {
            console.error("Pin error:", e);
            alert("固定設定の変更に失敗しました。\n※ブラウザの開発者ツール(F12)のコンソールにエラーURLが出ている場合はクリックしてインデックスを作成してください。");
        }
    };

    window.deletePost = async (id) => {
        if(!confirm("この投稿を削除しますか？")) return;
        try {
            await deleteDoc(doc(db, "posts", id));
            alert("削除しました");
        } catch(e) { 
            console.error(e);
            alert("削除できませんでした"); 
        }
    };

    const cleanupOldPosts = async () => {
        const cleanupQuery = query(postsRef, where("createdAt", "<=", Timestamp.fromDate(oneWeekAgo)));
        const snapshot = await getDocs(cleanupQuery);
        
        snapshot.forEach(async (docSnap) => {
            const data = docSnap.data();
            if (data.images && Array.isArray(data.images)) {
                for (const img of data.images) {
                    if (img.path) {
                        const imgRef = ref(storage, img.path);
                        try { await deleteObject(imgRef); } catch(e) { console.log("画像削除スキップ:", e); }
                    }
                }
            }
            await deleteDoc(doc(db, "posts", docSnap.id));
            console.log("古い投稿を削除しました:", docSnap.id);
        });
    };
    cleanupOldPosts();

    const editModal = document.getElementById("editModal");
    const editInput = document.getElementById("editInput");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const saveEditBtn = document.getElementById("saveEditBtn");
    let currentEditPostId = null;

    window.openEditModal = (id, currentText) => {
        currentEditPostId = id; editInput.value = currentText; editModal.classList.add('active');
    };
    const closeModal = () => { editModal.classList.remove('active'); currentEditPostId = null; };
    cancelEditBtn.addEventListener("click", closeModal);
    editModal.addEventListener("click", (e) => { if (e.target === editModal) closeModal(); });

    saveEditBtn.addEventListener("click", async () => {
        const newText = editInput.value.trim();
        if (!newText) return alert("内容を入力してください");
        if (!currentEditPostId) return;
        saveEditBtn.disabled = true; saveEditBtn.textContent = "保存中...";
        try { await updateDoc(doc(db, "posts", currentEditPostId), { text: newText }); closeModal(); }
        catch(e) { console.error("Error:", e); alert("編集できませんでした"); }
        finally { saveEditBtn.disabled = false; saveEditBtn.textContent = "保存する"; }
    });

    function escapeHtml(str) {
        if(!str) return "";
        return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }
</script>
</body>
</html>
